  async function loadVisitedOnline(){
    if(!navigator.onLine){
      return;
    }
    const { data, error } =
      await supabaseClient
        .from('visited_memories')
        .select('*')
        .order('created_at', { ascending: false });
    if(!error && data){
      visitedOnline = data;
    }
    for(let v of visitedOnline){
      const { data: likes } =
        await supabaseClient
          .from('memory_likes')
          .select('type,device_id')
          .eq('memory_id', v.id);
      v._likes =
        (likes || []).filter(x => x.type === 'like').length;
      v._dislikes =
        (likes || []).filter(x => x.type === 'dislike').length;
      v._my =
        (likes || []).find(x => x.device_id === deviceId)?.type || '';
      const { data: cmts } =
        await supabaseClient
          .from('memory_comments')
          .select('*')
          .eq('memory_id', v.id)
          .order('created_at', { ascending: true });
      v._comments = cmts || [];
    }
    if(currentFilter === 'Visited'){
      render();
    }
  }

  async function loadCafeInteractions(){
    if(!navigator.onLine){
      return;
    }
    const { data: likes } =
      await supabaseClient
        .from('cafe_likes')
        .select('*');
    const { data: cmts } =
      await supabaseClient
        .from('cafe_comments')
        .select('*')
        .order('created_at', {ascending: true});
    cafeInteractions = {};
    for(let c of cafes){
      cafeInteractions[c.nama] =
        {
          likes: 0,
          dislikes: 0,
          my: '',
          comments: []
        };
    }
    for(let l of (likes||[])){
      if(!cafeInteractions[l.cafe]){
        cafeInteractions[l.cafe] =
          {
            likes: 0,
            dislikes: 0,
            my: '',
            comments: []
          };
      }
      if(l.type==='like'){
        cafeInteractions[l.cafe].likes++;
      }
      if(l.type==='dislike'){
        cafeInteractions[l.cafe].dislikes++;
      }
      if(l.device_id===deviceId){
        cafeInteractions[l.cafe].my = l.type;
      }
    }
    for(let cm of (cmts||[])){
      if(!cafeInteractions[cm.cafe]){
        cafeInteractions[cm.cafe] =
          {
            likes: 0,
            dislikes: 0,
            my: '',
            comments: []
          };
      }
      cafeInteractions[cm.cafe].comments.push(cm);
    }
    if(currentFilter !== 'Visited'){
      render();
    }
  }

  async function saveVisited(){
    let cafe =
      document.getElementById('visit-cafe').value;
    let caption =
      document.getElementById('visit-caption').value.trim();
    let file =
      document.getElementById('visit-photo').files[0];
    if(!cafe){
      alert('Pilih cafe dulu!');
      return;
    }
    if(!navigator.onLine){
      alert('Tidak ada Internet!');
      return;
    }
    let btn =
      document.getElementById('btn-save');
    btn.textContent = 'Uploading...';
    btn.disabled = true;
    let photo_url = '';
    let photo_path ='';
    if(file){
      let fileName =
        Date.now() + '-' + file.name.replace(/[^a-zA-Z0-9.]/g, '');
        photo_path = fileName;
      const { error: upErr } =
        await supabaseClient
          .storage
          .from('visit-photos')
          .upload(fileName, file);
      if(upErr){
        alert('Upload gagal: ' + upErr.message);
        btn.textContent = 'Save Memory (Online)';
        btn.disabled = false;
        return;
      }
      const { data: pub } =
        supabaseClient
          .storage
          .from('visit-photos')
          .getPublicUrl(fileName);
      photo_url = pub.publicUrl;
    }
    const { error } =
      await supabaseClient
        .from('visited_memories')
        .insert(
          {
            cafe: cafe,
            caption: caption,
            photo_url: photo_url,
            photo_path: photo_path,
            device_id: deviceId,
          }
        );
    btn.textContent = 'Save Memory (Online)';
    btn.disabled = false;
    if(error){
      alert('Gagal save: ' + error.message);
      return;
    }
    closeVisitModal();
    currentFilter = 'Visited';
    await loadVisitedOnline();
    render();
    document
      .getElementById('grid')
      .scrollIntoView({ behavior: 'smooth' });
  }

  function restoreTyping(s) {

  function applyLang(){
    let btn =
      document.getElementById('lang-btn');
    if(btn){
      btn.textContent =
        currentLang==='ms' ? 'BM / EN' : 'EN / BM';
    }
    document
      .querySelectorAll('[placeholder]')
      .forEach(el=>{
        if(!el.dataset.msPh){
          el.dataset.msPh = el.placeholder;
        }
        let msPh = el.dataset.msPh;
        for(let k in T.ms){
          if(msPh.includes(k)){
            el.placeholder =
              msPh.replace(k, T[currentLang][k]);
            break;
          }
        }
      });
    let map = T[currentLang];
    let rev = T[currentLang==='ms'?'en':'ms'];
    document
      .querySelectorAll('button, h4, span, div, small, p, h1, h2, h3, label')
      .forEach(el=>{
        if(el.children.length>0){
          return;
        }
        let t = el.textContent.trim();
        for(let k in rev){
          if(
            t===k ||
            t.startsWith(k+' ') ||
            t.startsWith(k+' (')
          ){
            el.textContent =
              map[k]+t.slice(k.length);
            break;
          }
        }
      });
